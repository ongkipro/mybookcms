name: CI

# Verification only. Deployment belongs to each isolated MyBookCMS install and
# must be invoked explicitly under the release approval gate in RELEASE.md.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and static analysis
        run: npm run check

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
