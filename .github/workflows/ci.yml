name: CI

# Verification only. Deployment belongs to each isolated MyBookCMS install and
# must be invoked explicitly under the release approval gate in RELEASE.md.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and static analysis
        run: npm run check

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
